name: App Android

# Costruisce l'APK dell'app (Capacitor). Richiamato da rilascio.yml a ogni nuova versione su main, o
# con un tag di versione creato a mano (1.8.0 o v1.8.0), lo allega alla release di GitHub, anche con
# il nome fisso sbeggio.apk per il link di download permanente.
on:
  workflow_call:
    inputs:
      tag:
        description: Tag del rilascio a cui allegare l'APK (es. v1.9.0)
        type: string
        required: true
  push:
    tags: ['v*', '[0-9]+.[0-9]+.[0-9]+']
  pull_request:
    paths:
      - 'android/**'
      - 'capacitor.config.ts'
      - 'src/native/**'
      - 'package.json'
      - 'scripts/rilascio.ts'
      - 'scripts/versione.ts'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write # serve solo per allegare l'APK alla release

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        with:
          # Il predefinito include il pacchetto `tools`, che non esiste più nell'SDK recente.
          # Piattaforma e build-tools li scarica Gradle quando servono.
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - run: npm test
      - run: npm run build:android
      - name: Versione dell'app
        id: versione
        # versionCode = major × 10000 + minor × 100 + patch (scripts/versione.ts): cresce con la versione.
        run: |
          echo "numero=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
          echo "codice=$(npm run -s versione:codice)" >> "$GITHUB_OUTPUT"
      # Con i secret KRUMIRO_KEYSTORE_BASE64 e KRUMIRO_KEYSTORE_PASSWORD l'APK è firmato sempre con
      # la stessa chiave, quindi ogni versione si installa sopra la precedente. Senza, si ripiega su
      # una chiave di debug che cambia a ogni esecuzione.
      - name: Prepara la chiave di firma
        id: firma
        env:
          KEYSTORE_BASE64: ${{ secrets.KRUMIRO_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/krumiro.jks"
            echo "KRUMIRO_KEYSTORE=$RUNNER_TEMP/krumiro.jks" >> "$GITHUB_ENV"
            echo "tipo=release" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Secret KRUMIRO_KEYSTORE_BASE64 assente: APK firmato con una chiave di debug temporanea, non si installa sopra le versioni precedenti."
            echo "tipo=debug" >> "$GITHUB_OUTPUT"
          fi
      - name: Costruisci l'APK
        working-directory: android
        env:
          KRUMIRO_KEYSTORE_PASSWORD: ${{ secrets.KRUMIRO_KEYSTORE_PASSWORD }}
          TIPO: ${{ steps.firma.outputs.tipo }}
          VERSIONE: ${{ steps.versione.outputs.numero }}
          CODICE: ${{ steps.versione.outputs.codice }}
        run: |
          if [ "$TIPO" = release ]; then
            ./gradlew assembleRelease -PversionName="$VERSIONE" -PversionCode="$CODICE"
            cp app/build/outputs/apk/release/app-release.apk "../sbeggio-$VERSIONE.apk"
          else
            ./gradlew assembleDebug -PversionName="$VERSIONE" -PversionCode="$CODICE"
            cp app/build/outputs/apk/debug/app-debug.apk "../sbeggio-$VERSIONE.apk"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: sbeggio-apk
          path: sbeggio-${{ steps.versione.outputs.numero }}.apk
      # Con un tag creato a mano il tag esiste già; da rilascio.yml lo crea gh sul commit di main.
      - name: Allega l'APK alla release
        if: startsWith(github.ref, 'refs/tags/') || inputs.tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          # Prima le novità per gli utenti (src/core/novita.ts), poi l'elenco delle PR generato da GitHub.
          node --experimental-strip-types scripts/rilascio.ts note > note-rilascio.md
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --notes-file note-rilascio.md --generate-notes --target "$GITHUB_SHA"
          cp sbeggio-${{ steps.versione.outputs.numero }}.apk sbeggio.apk
          gh release upload "$TAG" sbeggio-${{ steps.versione.outputs.numero }}.apk sbeggio.apk --clobber
