<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Sbeggio</title>
    <meta name="description" content="Registra le timbrature di lavoro e calcola l'ora di uscita." />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f2f2f7" />
    <script>
      // Applica subito il tema scelto (vedi src/ui/tema.ts) per evitare un lampo di colore all'apertura.
      (function () {
        var p = null;
        try {
          p = localStorage.getItem('timbrature-tema');
        } catch (e) {}
        var scuro = p === 'scuro' || (p !== 'chiaro' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.setAttribute('data-tema', scuro ? 'scuro' : 'chiaro');
        document.querySelector('meta[name="theme-color"]').setAttribute('content', scuro ? '#000000' : '#f2f2f7');
      })();
    </script>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Sbeggio" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  </head>
  <body>
    <div id="app"></div>
    <noscript>Per usare Sbeggio attiva JavaScript.</noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
